<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장충동왕국밥 공식 웹사이트</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <header class="bg-white shadow-md p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-red-600">장충동왕국밥</h1>
            <div id="auth-section">
                </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6 mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <section class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">실시간 주가 현황</h2>
            <div class="flex items-center text-3xl">
                <span id="stock-price" class="font-bold text-gray-800">로딩중...</span>
                <span id="stock-change" class="text-lg ml-3"></span>
            </div>
            <p class="text-sm text-gray-400 mt-2">서버에서 최신 정보를 가져오고 있습니다.</p>
        </section>

        <section class="bg-white p-6 rounded-lg shadow md:col-span-2">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">최신 보도자료</h2>
            <div id="news-container" class="space-y-4">
                <p class="text-gray-500 animate-pulse">데이터를 불러오는 중입니다...</p>
            </div>
        </section>

    </main>

    <script src="./js/api.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
