<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전체 데이터 라인 차트</title>
  <style>
@font-face {
            font-family: 'NexonLv1Gothic';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/NEXON Lv1 Gothic OTF Light.woff') format('woff');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'NexonLv1Gothic';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/NEXON Lv1 Gothic OTF Bold.woff') format('woff');
            font-weight: 700;
            font-display: swap;
        }


    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: 'NexonLv1Gothic', sans-serif;
      background: #05070b;
    }

    #chartdiv {
      width: 100%;
      height: 100vh;
      min-height: 560px;
    }

    .status {
      position: fixed;
      left: 16px;
      bottom: 14px;
      z-index: 2;
      padding: 8px 10px;
      border: 1px solid #2b3240;
      border-radius: 6px;
      background: rgba(10, 14, 22, 0.92);
      color: #d8dee8;
      font-size: 12px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
    }
  </style>
</head>
<body>
  <div id="chartdiv"></div>
  <div id="status" class="status">데이터 불러오는 중...</div>

  <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

  <script>
    am5.ready(function () {
      var ticker = "장충동왕국밥";
      var dataUrl = "http://vers.kro.kr:4050/api/stockdataload/Securitykey_153295981258912938598/%EC%9E%A5%EC%B6%A9%EB%8F%99%EC%99%95%EA%B5%AD%EB%B0%A5";
      var status = document.getElementById("status");

      var root = am5.Root.new("chartdiv");
      var minorTheme = am5.Theme.new(root);

      minorTheme.rule("Grid", ["minor"]).setAll({
        strokeOpacity: 0.08
      });

      minorTheme.rule("AxisLabel", ["minor"]).setAll({
        dy: 8,
        fillOpacity: 0.35,
        fontSize: 10
      });

      root.setThemes([
        am5themes_Animated.new(root),
        minorTheme
      ]);

      root.container.setAll({
        fontFamily: "NexonLv1Gothic"
      });

      root.dateFormatter.setAll({
        dateFormat: "yyyy-MM-dd",
        dateFields: ["valueX"]
      });

      root.interfaceColors.setAll({
        background: am5.color(0x05070b),
        text: am5.color(0xd8dee8),
        grid: am5.color(0x4b5563)
      });

      var chart = root.container.children.push(am5xy.XYChart.new(root, {
        panX: true,
        panY: false,
        wheelX: "panX",
        wheelY: "zoomX",
        pinchZoomX: true,
        paddingLeft: 0
      }));

      var xRenderer = am5xy.AxisRendererX.new(root, {
        inversed: false,
        minGridDistance: 200,
        minorGridEnabled: true,
        minorLabelsEnabled: true
      });

      xRenderer.grid.template.setAll({
        stroke: am5.color(0x4b5563),
        strokeOpacity: 0.18
      });
      xRenderer.labels.template.setAll({
        fill: am5.color(0xd8dee8),
        fillOpacity: 0.78,
        fontFamily: "NexonLv1Gothic"
      });

      var xAxis = chart.xAxes.push(am5xy.DateAxis.new(root, {
        baseInterval: {
          timeUnit: "day",
          count: 1
        },
        markUnitChange: false,
        dateFormats: {
          day: "yyyy-MM-dd",
          month: "yyyy-MM",
          year: "yyyy"
        },
        minorDateFormats: {
          day: "yyyy-MM-dd",
          month: "yyyy-MM",
          year: "yyyy"
        },
        renderer: xRenderer,
        tooltip: am5.Tooltip.new(root, {})
      }));

      var yRenderer = am5xy.AxisRendererY.new(root, {});
      yRenderer.grid.template.setAll({
        stroke: am5.color(0x4b5563),
        strokeOpacity: 0.18
      });
      yRenderer.labels.template.setAll({
        fill: am5.color(0xd8dee8),
        fillOpacity: 0.78,
        fontFamily: "NexonLv1Gothic"
      });

      var yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, {
        renderer: yRenderer,
        tooltip: am5.Tooltip.new(root, {})
      }));

      var series = chart.series.push(am5xy.LineSeries.new(root, {
        name: ticker,
        xAxis: xAxis,
        yAxis: yAxis,
        valueXField: "date",
        valueYField: "value",
        stroke: am5.color(0xd94141),
        fill: am5.color(0xd94141),
        tooltip: am5.Tooltip.new(root, {
          labelText: "[bold]{name}[/]\n{valueX.formatDate('yyyy-MM-dd')}: {valueY.formatNumber('#,###')}"
        })
      }));

      series.strokes.template.setAll({
        strokeWidth: 2
      });

      series.strokes.template.adapters.add("stroke", function (stroke, target) {
        var dataItem = target.dataItem;
        var dataContext = dataItem ? dataItem.dataContext : null;
        return dataContext && dataContext.color ? am5.color(dataContext.color) : stroke;
      });

      series.bullets.push(function () {
        var circle = am5.Circle.new(root, {
          radius: 5,
          fill: series.get("fill"),
          stroke: root.interfaceColors.get("background"),
          strokeWidth: 2
        });

        circle.adapters.add("fill", function (fill, target) {
          var dataItem = target.dataItem;
          var dataContext = dataItem ? dataItem.dataContext : null;
          return dataContext && dataContext.color ? am5.color(dataContext.color) : fill;
        });

        circle.animate({
          key: "scale",
          from: 0,
          to: 1,
          duration: 700,
          easing: am5.ease.out(am5.ease.cubic)
        });

        return am5.Bullet.new(root, {
          sprite: circle
        });
      });

      var cursor = chart.set("cursor", am5xy.XYCursor.new(root, {
        behavior: "zoomX",
        xAxis: xAxis,
        yAxis: yAxis
      }));
      cursor.lineY.set("visible", true);

      chart.set("scrollbarX", am5.Scrollbar.new(root, {
        orientation: "horizontal"
      }));

      function parseDate(dateText) {
        var parts = String(dateText).split("-").map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2]).getTime();
      }

      function numberOrZero(value) {
        var numeric = Number(value);
        return Number.isFinite(numeric) ? numeric : 0;
      }

      function normalizeApiData(payload) {
        var stockData = payload && payload.data && payload.data.StockData ? payload.data.StockData : {};
        var source = stockData.fluctuationValue || {};

        return Object.keys(source).map(function (dateText) {
          var day = source[dateText] || {};
          var ticks = Object.keys(day.values || {}).map(function (timeText) {
            return day.values[timeText];
          }).filter(function (tick) {
            return tick && Number(tick.price) > 0;
          });

          var value = ticks.length ? numberOrZero(ticks[ticks.length - 1].price) : numberOrZero(day.OldPrice);

          return {
            date: parseDate(dateText),
            value: value
          };
        }).filter(function (row) {
          return Number.isFinite(row.date) && row.value > 0;
        }).sort(function (a, b) {
          return a.date - b.date;
        });
      }

      function applyTrendColors(data) {
        data.forEach(function (row, index) {
          var previous = index > 0 ? data[index - 1] : null;
          if (!previous || row.value >= previous.value) {
            row.color = 0xd94141;
          } else {
            row.color = 0x3b82f6;
          }
        });

        return data;
      }

      am5.net.load(dataUrl).then(function (result) {
        var data = applyTrendColors(normalizeApiData(JSON.parse(result.response || "{}")));

        if (!data.length) {
          throw new Error("No usable rows were found.");
        }

        series.data.setAll(data);
        status.textContent = ticker + " 데이터 로드 완료: " + data.length + "일";

        series.appear(1000);
        chart.appear(1000, 100);
      }).catch(function (error) {
        status.textContent = "외부 데이터를 불러오지 못했습니다: " + error.message;
      });
    });
  </script>
</body>
</html>
